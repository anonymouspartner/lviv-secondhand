name = "lviv-metrics"
main = "worker.js"
compatibility_date = "2026-08-01"

# Anonymous usage-metrics store (see worker.js). Created via the Cloudflare
# Developer Platform; database_id is not a secret.
[[d1_databases]]
binding = "DB"
database_name = "lviv-metrics"
database_id = "ed588947-b668-4082-8e2a-5eee35234832"

# Per-IP rate limit: max 120 requests / 60s (each request may batch up to 20
# events). Blocks scripted spam while leaving normal tapping unaffected.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Two crons share scheduled() in worker.js (branches on event.cron):
#   0 7 * * *  — daily restock-notification: 07:00 UTC (~09:00–10:00 Kyiv).
#                Figures out which stores restock "today" (Europe/Kyiv) and
#                pushes to followers.
#   */5 * * * * — early-bird flash-deal broadcast sweep (Feature 6): sends any
#                pending_broadcasts row whose 15-minute delay has elapsed.
[triggers]
crons = ["0 7 * * *", "*/5 * * * *"]

# Public VAPID key (safe to publish; matches VAPID_PUBLIC_KEY in index.html).
# The private key is set separately as the VAPID_PRIVATE secret — NEVER commit it.
[vars]
VAPID_PUBLIC = "BBfji9HA_fVrn42DeYako-WekhEo60jc_9f7UmHf67kpEqv7JdmLaonrkLWfSEYMLARMgG9jVovK7W3uUDNp7kU"
# Telegram chat that gets a ping when a promotion or an à la carte order is paid.
# Not a secret (it is just a chat id, same value as telegram-bot/wrangler.toml).
# The notification stays off until the BOT_TOKEN secret is also set — see below.
OWNER_ID = "1212541015"
# The ФОП's details, printed on bank-transfer invoices and acts (GET /invoice,
# the bot's /invoice). Public by design — the same details the offer page
# (offer.html §12) shows — so they live here rather than as secrets. If one is
# ever blanked, /invoice answers that it is missing instead of issuing an
# invoice with blanks. SELLER_BANK defaults to PrivatBank.
SELLER_NAME = "ФОП Хейген Тімоті Рендалл"
SELLER_TAX_ID = "3537413536"
SELLER_ADDRESS = "79008, Львівська обл., м. Львів, вул. Театральна, буд. 7, кв. 6"
SELLER_IBAN = "UA503052990000026008031043785"
SELLER_TAX_STATUS = "Платник єдиного податку 3 групи, не є платником ПДВ"
# Show the buy buttons while the LiqPay keys are still sandbox_… keys, so
# LiqPay's merchant review can find a way to pay on the site. "1" = on, anything
# else = off. Test payments charge nothing and publish nothing, and the app
# marks the buttons "Test mode". Has no effect on live keys (the buttons show
# then anyway) — set it to "" once the live keys are in, and redeploy.
SHOW_BUY_IN_SANDBOX = "1"
# The Барахолка channel, so the listings sweep can delete an expired post.
# Not a secret — a public channel handle is public by definition, same
# reasoning as OWNER_ID above and as the TG_CHANNEL repository *variable* the
# posting workflows read. It is duplicated here rather than shared because a
# GitHub Actions variable is not a Worker binding: the workflows and the Worker
# genuinely cannot see each other's configuration.
TG_CHANNEL = "@Lviv_Secondhand"
# Optional: a separate group/channel chat id for edit-suggestion moderation
# (Feature 6, POST /api/edit/stash → claim → the moderator's ✅/❌). Falls
# back to OWNER_ID above when unset — set this only if you want edit review
# to go somewhere other than the owner's own DMs.
# MODERATOR_CHANNEL_ID = "-100..."

# ── Paid promotions, flash deals and extras — LiqPay (PrivatBank) — off by default ──
# GET /promos serves the live promo set with no secret. Selling (/promote,
# /flash-deal, /order) goes through LiqPay only; see docs/FOP.md §3. Three
# values, all set as repository secrets so deploy-worker.yml pushes them (or
# with `wrangler secret put`):
#   LIQPAY_PUBLIC_KEY  — the shop's public key (sandbox_… while testing).
#   LIQPAY_PRIVATE_KEY — the shop's private key. Signs checkouts and verifies
#                        POST /liqpay-callback. NEVER commit it.
#   PAY_PROVIDER       — "liqpay" to switch card checkout on; anything else (or
#                        unset) means no card checkout at all (sell by bank-
#                        transfer invoice from the bot). The callback keeps
#                        working whenever both keys are set, so subscriptions
#                        already sold keep renewing even with checkout off.
# LiqPay needs no webhook set up on its side: every checkout names
# https://lviv-metrics.lshanalytic.workers.dev/liqpay-callback as its server_url.
# Sandbox keys (sandbox_…) never publish anything: test payments are announced to
# the owner as tests, and the app hides checkout while they are set.
#   BOT_TOKEN          — the same Telegram bot token the bot Worker uses (repo
#                        secret BOT_TOKEN, already set if the bot is deployed).
#                        With it, a sale, an invoice payment or a failed
#                        fulfilment pings OWNER_ID above. Without it, sales are
#                        silent and the order queue has to be read from GET
#                        /orders by hand.
#
# ── Stripe — no longer sells; the account stays (docs/STRIPE_RETIREMENT.md) ──
# The site no longer opens Stripe checkouts. The account is shared with
# another business, so its webhook still delivers events here:
#   STRIPE_WEBHOOK_SECRET — verifies POST /stripe-webhook. While it is set the
#                          route answers 200 to everything it can verify, ignores
#                          events that are not ours, and pings OWNER_ID if a UAH
#                          payment still arrives through an old Payment Link.
#   STRIPE_API_KEY       — only used by GET /billing (the Stripe customer portal)
#                          for a store that bought a Stripe subscription before
#                          the switch; none are active. Kept as the owner asked.
# NEVER commit either.
#
# ── Field-scout deep link (POST /api/bounty/stash) — optional ──
# Signs a short-lived token identifying a store, for the app's
# ?store=id&agent_mode=true flow to hand off to the Telegram bot's
# inline-keyboard cycle/day/hours picker. Off (503) until set — and MUST be
# the exact same value as the bot Worker's (telegram-bot/) BOUNTY_SECRET,
# which verifies the token this one signs:
#   BOUNTY_SECRET — printf '%s' "<random>" | npx wrangler@3 secret put BOUNTY_SECRET
#
# ── Flash deals (GET /flash-deal, POST /liqpay-callback, GET /flash-deal/approve) — optional ──
# A short-lived paid sale (same checkout and fulfilment as promotions above).
# Needs the LiqPay values above, plus:
#   GH_PAT — classic PAT with the `repo` scope, used to dispatch the
#               published deal to .github/workflows/update-map.yml (same
#               pipeline the field-scout flow uses — see scripts/patch-store.js):
#                 printf '%s' "<pat>" | npx wrangler@3 secret put GH_PAT
# ADMIN_KEY (already used by /admin/test and /orders — see docs/ADVERTISING.md)
# gates the one-tap "approve" link sent to the owner when a deal has no
# matching PIN on file. A store's PIN (optional; lets a trusted buyer skip
# owner review) has no self-service UI yet — set it directly:
#   npx wrangler@3 d1 execute lviv-metrics --remote --command \
#     "INSERT INTO store_pins (store_id, pin) VALUES ('c21', '1234') ON CONFLICT(store_id) DO UPDATE SET pin=excluded.pin"
