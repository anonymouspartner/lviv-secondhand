name = "lviv-metrics"
main = "worker.js"
compatibility_date = "2026-08-01"

# Anonymous usage-metrics store (see worker.js). Created via the Cloudflare
# Developer Platform; database_id is not a secret.
[[d1_databases]]
binding = "DB"
database_name = "lviv-metrics"
database_id = "ed588947-b668-4082-8e2a-5eee35234832"

# Per-IP rate limit: max 120 requests / 60s (each request may batch up to 20
# events). Blocks scripted spam while leaving normal tapping unaffected.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Two crons share scheduled() in worker.js (branches on event.cron):
#   0 7 * * *  — daily restock-notification: 07:00 UTC (~09:00–10:00 Kyiv).
#                Figures out which stores restock "today" (Europe/Kyiv) and
#                pushes to followers.
#   */5 * * * * — early-bird flash-deal broadcast sweep (Feature 6): sends any
#                pending_broadcasts row whose 15-minute delay has elapsed.
[triggers]
crons = ["0 7 * * *", "*/5 * * * *"]

# Public VAPID key (safe to publish; matches VAPID_PUBLIC_KEY in index.html).
# The private key is set separately as the VAPID_PRIVATE secret — NEVER commit it.
[vars]
VAPID_PUBLIC = "BBfji9HA_fVrn42DeYako-WekhEo60jc_9f7UmHf67kpEqv7JdmLaonrkLWfSEYMLARMgG9jVovK7W3uUDNp7kU"
# Telegram chat that gets a ping when a promotion or an à la carte order is paid.
# Not a secret (it is just a chat id, same value as telegram-bot/wrangler.toml).
# The notification stays off until the BOT_TOKEN secret is also set — see below.
OWNER_ID = "1212541015"
# Optional: a separate group/channel chat id for edit-suggestion moderation
# (Feature 6, POST /api/edit/stash → claim → the moderator's ✅/❌). Falls
# back to OWNER_ID above when unset — set this only if you want edit review
# to go somewhere other than the owner's own DMs.
# MODERATOR_CHANNEL_ID = "-100..."

# ── Paid promotions (Stripe self-fulfilment) — optional, off until configured ──
# GET /promos serves the live promo set with no secret. Selling + auto-fulfil
# need two secrets (set them as repo secrets so deploy-worker.yml pushes them,
# or with `wrangler secret put`); the feature stays inert until both exist:
#   STRIPE_API_KEY       — a *restricted* Stripe secret key with write access to
#                          Checkout Sessions (create) — used by GET /promote to
#                          open a store-bound checkout. NEVER commit it.
#                          Optionally also Billing Portal Sessions (create), which
#                          turns on GET /billing (the in-app "Manage billing" link);
#                          without it that route fails and the app hides the link.
#   STRIPE_WEBHOOK_SECRET — the signing secret of the Stripe webhook endpoint
#                          pointed at https://lviv-metrics.lshanalytic.workers.dev/stripe-webhook
#                          (events: checkout.session.completed, invoice.paid,
#                          customer.subscription.deleted/updated). Verifies the
#                          POST /stripe-webhook signature. NEVER commit it.
#   BOT_TOKEN            — the same Telegram bot token the bot Worker uses (repo
#                          secret BOT_TOKEN, already set if the bot is deployed).
#                          With it, a paid promotion or à la carte order pings
#                          OWNER_ID above. Without it, sales are silent and the
#                          order queue has to be read from GET /orders by hand.
# See docs/ADVERTISING.md §7 for the full activation steps.
#
# ── Field-scout deep link (POST /api/bounty/stash) — optional ──
# Signs a short-lived token identifying a store, for the app's
# ?store=id&agent_mode=true flow to hand off to the Telegram bot's
# inline-keyboard cycle/day/hours picker. Off (503) until set — and MUST be
# the exact same value as the bot Worker's (telegram-bot/) BOUNTY_SECRET,
# which verifies the token this one signs:
#   BOUNTY_SECRET — printf '%s' "<random>" | npx wrangler@3 secret put BOUNTY_SECRET
#
# ── Flash deals (GET /flash-deal, POST /stripe-webhook, GET /flash-deal/approve) — optional ──
# A short-lived paid sale (Stripe self-fulfilment, same pattern as promotions
# above). Needs STRIPE_API_KEY + STRIPE_WEBHOOK_SECRET above, plus:
#   GITHUB_PAT — classic PAT with the `repo` scope, used to dispatch the
#               published deal to .github/workflows/update-map.yml (same
#               pipeline the field-scout flow uses — see scripts/patch-store.js):
#                 printf '%s' "<pat>" | npx wrangler@3 secret put GITHUB_PAT
# ADMIN_KEY (already used by /admin/test and /orders — see docs/ADVERTISING.md)
# gates the one-tap "approve" link sent to the owner when a deal has no
# matching PIN on file. A store's PIN (optional; lets a trusted buyer skip
# owner review) has no self-service UI yet — set it directly:
#   npx wrangler@3 d1 execute lviv-metrics --remote --command \
#     "INSERT INTO store_pins (store_id, pin) VALUES ('c21', '1234') ON CONFLICT(store_id) DO UPDATE SET pin=excluded.pin"
