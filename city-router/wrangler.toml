name = "lviv-city-router"
main = "worker.js"
compatibility_date = "2026-08-01"

# Serves the city subdomains from the www GitHub Pages site (see worker.js).
# Each city subdomain needs its own PROXIED (orange-cloud) DNS record on
# lvivsecondhand.com — target AAAA 100:: (a documented "no origin" placeholder),
# because the Worker answers before the record is ever used. Do NOT add a
# wildcard `*` record: the Worker passes any non-city host through to its own
# origin, and a wildcard would give unknown hosts none. www stays DNS-only
# (grey cloud) → GitHub Pages, as it is today; other proxied hosts on the zone
# (read.lvivsecondhand.com) are untouched because the Worker passes them through.
routes = [
  { pattern = "*.lvivsecondhand.com/*", zone_name = "lvivsecondhand.com" },
]
