name = "lviv-tg-bot"
main = "worker.js"
compatibility_date = "2026-08-01"

# ── Public bot (always on) ──────────────────────────────────────────────────
# The /today /cheap /submit commands are stateless: the bot answers inside the
# webhook response, so the bot token is NOT needed at runtime — only when
# registering the webhook (see docs/TELEGRAM_BOT.md).
#
# One secret is required (set out-of-band, never committed):
#   WEBHOOK_SECRET — a random string; Telegram echoes it back in the
#   `X-Telegram-Bot-Api-Secret-Token` header so the Worker can verify that
#   inbound requests really come from Telegram. Set it with:
#     printf '%s' "<random>" | npx wrangler@3 secret put WEBHOOK_SECRET
#   and pass the SAME value as `secret_token` when calling setWebhook.

# ── Field-agent /visit subsystem (opt-in) ───────────────────────────────────
# Adds the stateful store-survey flow (/visit, /report, /export — see
# docs/FIELD_AGENT.md). It stays OFF until BOT_TOKEN *and* the VISITS KV
# namespace below are both configured, so the public bot is unaffected until
# you deliberately enable it.
#
# To enable:
#   1. Create the KV namespace and paste its id below, then uncomment the block:
#        npx wrangler@3 kv namespace create VISITS
#   2. Add the bot token as a secret (used to send the guided prompts, push
#      each visit to the owner, and upload the CSV export):
#        printf '%s' "<telegram-bot-token>" | npx wrangler@3 secret put BOT_TOKEN
#   3. Set who is who + the pay rates as [vars] below (ids are numeric Telegram
#      user ids — ask the person to forward a message to @userinfobot, or read
#      the id from the bot's own logs after they message it).
#   4. Re-register the webhook (register-webhook.yml already requests both
#      message and callback_query updates).
#
[[kv_namespaces]]
binding = "VISITS"
id = "69158c00d55a4d3ab750cd916afca445"

[vars]
OWNER_ID   = "1212541015"    # owner — gets /report, /export, and a live push of each visit
AGENT_IDS  = "1212541015,5677605074"    # agents allowed to run /visit (comma-separated): owner (smoke-test) + field agent.
RATE_VISIT = "80"  # ₴ per verified visit
RATE_BONUS = "200" # ₴ per bonus event (poster placed / owner contact + consent)

# ── Field-scout "bounty" flow (opt-in) ──────────────────────────────────────
# Adds the inline-keyboard cycle/day/hours picker, entered via a deep link
# from ?store=id&agent_mode=true in the app (see telegram-agent-keyboards.js).
# Stays off (link replies "invalid") until both secrets below are set, on top
# of BOT_TOKEN + VISITS above:
#   BOUNTY_SECRET — HMAC key verifying the deep-link token. MUST be the exact
#                  same value as the metrics Worker's BOUNTY_SECRET (worker/),
#                  which signs it — set both with the same random string:
#                    printf '%s' "<random>" | npx wrangler@3 secret put BOUNTY_SECRET
#   GITHUB_PAT    — classic PAT with the `repo` scope, used to dispatch the
#                  confirmed patch to .github/workflows/update-map.yml:
#                    printf '%s' "<pat>" | npx wrangler@3 secret put GITHUB_PAT
#
# ── Crowdsourced moderation (opt-in) ────────────────────────────────────────
# Adds /start edit_<id> (claims a web-submitted correction — see
# POST /api/edit/stash in worker/worker.js), the ✅/❌ moderator buttons
# (isOwner/isAgent only, from OWNER_ID/AGENT_IDS above), and /leaderboard.
# Needs one more secret, on top of BOT_TOKEN + VISITS:
#   ADMIN_KEY — MUST be the exact same value as the metrics Worker's
#              ADMIN_KEY (already used there by /admin/test and
#              /flash-deal/approve) — this Worker calls POST /api/edit/resolve
#              with it when a moderator taps ✅/❌:
#                printf '%s' "<same value as the metrics Worker's ADMIN_KEY>" | npx wrangler@3 secret put ADMIN_KEY
