name: Post to Instagram

# Publishes one image from this repo to the Instagram account, using the
# Instagram Content Publishing API (Meta Graph API).
#
# WHY THIS SHAPE
# The API does not accept file uploads — it takes a PUBLIC IMAGE URL and fetches
# it itself. That is normally the awkward part, but this repo already solves it:
# GitHub Pages serves the repo root, so every image under marketing/ is already
# live at https://www.lvivsecondhand.com/... the moment it is committed. So the
# workflow just points Meta at a URL that already exists.
#
# CHECKING CONFIG WITHOUT POSTING
# Tick `dry_run` to run the three pre-flights and stop. Use it after changing a
# secret or refreshing the token — verifying those by posting costs a real post
# on a real feed, which is a bad way to test a config change.
#
# SAFE UNTIL CONFIGURED
# workflow_dispatch only — there is no schedule, so this never fires on its own.
# It also exits cleanly (not red) when the secrets are missing, so an
# unconfigured repo does not accumulate failed runs. Add a schedule below only
# once you have posted successfully by hand a few times.
#
# WHICH API PATH THIS TARGETS
# Meta ships two incompatible Instagram APIs. This targets **Instagram API with
# Instagram Login** — host graph.instagram.com, permissions instagram_business_*,
# no Facebook Page involved in the calls. The other path (Facebook Login, host
# graph.facebook.com, permissions instagram_basic/instagram_content_publish)
# needs different endpoints and will not work with these secrets. Your app
# dashboard names which one you set up.
#
# SETUP: see docs/INSTAGRAM.md. In short you need an Instagram Business or
# Creator account, a Meta app set up for Instagram login, and two repo secrets:
#   IG_USER_ID       — the Instagram user id from `me?fields=user_id`
#   IG_ACCESS_TOKEN  — a long-lived Instagram User token with
#                      instagram_business_content_publish
#
# NO APP REVIEW NEEDED. Meta's docs push you toward App Review with a screencast
# submission, but that gate only applies to publishing on behalf of accounts you
# do NOT own. An app left in Development mode can publish to accounts that hold a
# role on it (admin/developer/tester) — which, posting to your own account, is
# the case here.
#
# TOKEN EXPIRY IS THE THING THAT BITES
# Long-lived tokens last 60 days. Unlike the Facebook Login path there is no
# debug_token endpoint here, so days-remaining cannot be reported — the
# pre-flight verifies the token still works and prints a standing reminder
# instead. Refresh roughly every 50 days; see docs/INSTAGRAM.md.

on:
  # Callable from deals-image.yml so the Monday image posts itself, and
  # dispatchable by hand for the promo set. Both surfaces read the same
  # `inputs` context, so there is one set of parameters, not two.
  workflow_call:
    inputs:
      image:    { type: string,  required: true }
      caption:  { type: string,  required: true }
      dry_run:  { type: boolean, required: false, default: false }
  workflow_dispatch:
    inputs:
      image:
        description: "Image path in this repo (must be committed, served, and JPEG)"
        required: true
        default: "marketing/instagram/2-cycle-portrait.jpg"
      caption:
        description: "Caption (max 2200 chars, up to 30 hashtags)"
        required: true
        default: |
          Усі секонд-хенди Львова на одній карті 🧥

          Адреси, години роботи — і головне, скільки днів минуло від останнього завозу в кожному магазині.

          Безкоштовно, без реєстрації → www.lvivsecondhand.com

          #секондхенд #секондхендльвів #львів #lviv #сектор #шопінгльвів #thrifting #secondhand #вінтаж #ukraine
      dry_run:
        description: "Check config only — run the pre-flights and stop before posting"
        type: boolean
        required: false
        default: false
  # Uncomment once a manual run has succeeded and you want it automatic.
  # schedule:
  #   - cron: "0 9 * * 1"   # Mondays 09:00 UTC (~12:00 Europe/Kyiv)

permissions:
  contents: read

env:
  SITE: https://www.lvivsecondhand.com
  GRAPH: https://graph.instagram.com/v26.0

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Exit 0, not 1: an unconfigured repo should be a no-op, not a red run.
      - name: Check secrets are configured
        id: guard
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "::notice::IG_USER_ID / IG_ACCESS_TOKEN not set — skipping. See docs/INSTAGRAM.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Meta fetches the URL itself, and a 404 there surfaces as an opaque
      # container error hours of debugging later. Check it up front instead.
      - name: Pre-flight — image is committed and publicly reachable
        if: steps.guard.outputs.ready == 'true'
        env:
          IMG: ${{ inputs.image }}
        run: |
          if [ ! -f "$IMG" ]; then
            echo "::error::$IMG is not in the repo. Commit it first — Meta fetches it over HTTP."
            exit 1
          fi
          # Meta's content-publishing API accepts JPEG only. Caught here because
          # the API's own rejection is a generic container error that says
          # nothing about the format.
          case "$IMG" in
            *.jpg|*.jpeg) ;;
            *) echo "::error::$IMG is not a JPEG. Instagram's API accepts JPEG only — use marketing/instagram/*.jpg."
               exit 1 ;;
          esac
          URL="$SITE/$IMG"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -L "$URL")
          if [ "$CODE" != "200" ]; then
            echo "::error::$URL returned HTTP $CODE. It must be publicly reachable before Meta can fetch it (Pages may lag a commit by a minute)."
            exit 1
          fi
          echo "IMAGE_URL=$URL" >> "$GITHUB_ENV"
          echo "Image OK: $URL"

      # /debug_token lives on graph.facebook.com and has no equivalent here, so
      # this path cannot report days-remaining. `me` is the substitute: it fails
      # on an expired or wrong-scoped token.
      #
      # It also resolves WHICH account to post to. The token already determines
      # that — it can only publish to its own account — so the id from `me` is
      # authoritative and IG_USER_ID is a cross-check, not the source of truth.
      # An earlier version errored on a mismatch and blocked a perfectly good
      # token; the dashboard shows an Instagram *app* id next to the account id,
      # and copying the wrong one should not be fatal.
      - name: Pre-flight — token validity
        if: steps.guard.outputs.ready == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          RESP=$(curl -sG "$GRAPH/me" \
            --data-urlencode "fields=id,user_id,username" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          # Not UID: that name is readonly in bash and the assignment fails.
          ME_ID=$(echo "$RESP" | jq -r '.id // empty')
          ME_USER_ID=$(echo "$RESP" | jq -r '.user_id // empty')
          NAME=$(echo "$RESP" | jq -r '.username // empty')
          if [ -z "$ME_ID" ] && [ -z "$ME_USER_ID" ]; then
            echo "::error::Token rejected by Instagram: $(echo "$RESP" | jq -c '.error // .')"
            exit 1
          fi
          # This path exposes both an app-scoped id and the professional-account
          # id, and which one the publish endpoints want has moved between API
          # versions. Prefer user_id, fall back to id.
          PUBLISH_ID="${ME_USER_ID:-$ME_ID}"
          echo "Token valid — authenticated as @$NAME."
          if [ "$IG_USER_ID" = "$ME_USER_ID" ] || [ "$IG_USER_ID" = "$ME_ID" ]; then
            echo "IG_USER_ID matches the token's account."
          else
            echo "::warning::IG_USER_ID (${#IG_USER_ID} chars) matches neither id on this token (user_id ${#ME_USER_ID} chars, id ${#ME_ID} chars). Posting to the token's own account. Most likely the Instagram *app* id was copied from the dashboard instead of the account id — harmless, but worth correcting in the secret."
          fi
          echo "PUBLISH_ID=$PUBLISH_ID" >> "$GITHUB_ENV"
          # Instagram Login tokens last 60 days and this path exposes no expiry
          # to check, so the reminder is unconditional rather than a threshold.
          echo "::notice::Instagram Login tokens expire 60 days after issue and cannot be inspected here. Refresh via the refresh_access_token endpoint (docs/INSTAGRAM.md) roughly every 50 days."

      # Step 1 of 2: create the media container. Meta downloads the image here.
      - name: Create media container
        if: steps.guard.outputs.ready == 'true' && inputs.dry_run != true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CAPTION: ${{ inputs.caption }}
        run: |
          RESP=$(curl -s -X POST "$GRAPH/$PUBLISH_ID/media" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "caption=$CAPTION" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          ID=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$ID" ]; then
            # Print Meta's own message — a generic "failed" here is what made the
            # equivalent bug in the app take a whole round-trip to diagnose.
            echo "::error::Container creation failed: $(echo "$RESP" | jq -c '.error // .')"
            exit 1
          fi
          echo "CREATION_ID=$ID" >> "$GITHUB_ENV"
          echo "Container created: $ID"

      # Images are usually ready immediately, but publishing a container that is
      # still processing fails — so wait for FINISHED rather than assuming.
      - name: Wait for the container to finish processing
        if: steps.guard.outputs.ready == 'true' && inputs.dry_run != true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          for i in $(seq 1 20); do
            RESP=$(curl -sG "$GRAPH/$CREATION_ID" \
              --data-urlencode "fields=status_code,status" \
              --data-urlencode "access_token=$IG_ACCESS_TOKEN")
            STATUS=$(echo "$RESP" | jq -r '.status_code // empty')
            case "$STATUS" in
              FINISHED) echo "Container ready."; exit 0 ;;
              ERROR|EXPIRED)
                echo "::error::Container $STATUS: $(echo "$RESP" | jq -c '.status // .')"
                exit 1 ;;
              *) echo "status=$STATUS (attempt $i) — waiting…"; sleep 6 ;;
            esac
          done
          echo "::error::Container never reached FINISHED after ~2 minutes."
          exit 1

      # Without this a dry run ends green with no output, which reads exactly
      # like a successful post — the one confusion this feature must not create.
      - name: Dry run — report and stop
        if: steps.guard.outputs.ready == 'true' && inputs.dry_run == true
        run: |
          {
            echo "### Dry run — nothing was posted"
            echo ""
            echo "Pre-flights passed: the image is reachable and the token is valid."
            echo "Re-run with **dry_run unchecked** to publish."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Dry run complete — config is good, nothing posted."

      # Step 2 of 2: publish. This is the irreversible one — it goes live.
      - name: Publish
        if: steps.guard.outputs.ready == 'true' && inputs.dry_run != true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          RESP=$(curl -s -X POST "$GRAPH/$PUBLISH_ID/media_publish" \
            --data-urlencode "creation_id=$CREATION_ID" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          MEDIA_ID=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$MEDIA_ID" ]; then
            echo "::error::Publish failed: $(echo "$RESP" | jq -c '.error // .')"
            exit 1
          fi
          LINK=$(curl -sG "$GRAPH/$MEDIA_ID" \
            --data-urlencode "fields=permalink" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN" | jq -r '.permalink // empty')
          echo "::notice::Published: ${LINK:-$MEDIA_ID}"
          {
            echo "### Posted to Instagram"
            echo ""
            echo "- **Image:** \`${{ inputs.image }}\`"
            echo "- **Post:** ${LINK:-$MEDIA_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
