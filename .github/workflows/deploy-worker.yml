name: Deploy metrics Worker

# Deploys the usage-metrics Worker (worker/) to Cloudflare whenever its code
# changes. Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   — a token with "Edit Cloudflare Workers" + "D1 Edit"
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
      # Sets the VAPID private key as a Worker secret (needed for restock push).
      # Skips cleanly if the VAPID_PRIVATE repo secret isn't set yet.
      - name: Set VAPID private key secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: |
          if [ -z "$VAPID_PRIVATE" ]; then echo "VAPID_PRIVATE not set — skipping (restock push stays off until you add it)"; exit 0; fi
          printf '%s' "$VAPID_PRIVATE" | npx --yes wrangler@3 secret put VAPID_PRIVATE
      - name: Set admin key secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then echo "ADMIN_KEY not set — skipping (server-side broadcast test stays off until you add it)"; exit 0; fi
          printf '%s' "$ADMIN_KEY" | npx --yes wrangler@3 secret put ADMIN_KEY
      # Stripe no longer sells (docs/STRIPE_RETIREMENT.md). The account stays
      # and is shared with another business, so the webhook secret keeps
      # /stripe-webhook verifying (and answering 200 to) its events; the API
      # key only backs GET /billing. Both kept as the owner asked.
      - name: Set Stripe API key secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: |
          if [ -z "$STRIPE_API_KEY" ]; then echo "STRIPE_API_KEY not set — skipping (only GET /billing uses it)"; exit 0; fi
          printf '%s' "$STRIPE_API_KEY" | npx --yes wrangler@3 secret put STRIPE_API_KEY
      # Lets the metrics Worker ping the owner on Telegram when a sale lands.
      # Reuses the bot's own token; skips cleanly when it isn't set.
      - name: Set Telegram bot token secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then echo "BOT_TOKEN not set — skipping (sale notifications stay off until you add it)"; exit 0; fi
          printf '%s' "$BOT_TOKEN" | npx --yes wrangler@3 secret put BOT_TOKEN
      - name: Set Stripe webhook secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          if [ -z "$STRIPE_WEBHOOK_SECRET" ]; then echo "STRIPE_WEBHOOK_SECRET not set — skipping (/stripe-webhook stays off until you add it)"; exit 0; fi
          printf '%s' "$STRIPE_WEBHOOK_SECRET" | npx --yes wrangler@3 secret put STRIPE_WEBHOOK_SECRET
      # LiqPay (PrivatBank) — the payment provider; see docs/FOP.md §3.
      # All three optional, and card checkout stays off until PAY_PROVIDER is
      # "liqpay" AND both keys are set. To switch checkout off again, set
      # PAY_PROVIDER to "off" (a Worker secret outlives the repository secret
      # it came from, so deleting the repository secret alone would not do it).
      - name: Set LiqPay secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIQPAY_PUBLIC_KEY: ${{ secrets.LIQPAY_PUBLIC_KEY }}
          LIQPAY_PRIVATE_KEY: ${{ secrets.LIQPAY_PRIVATE_KEY }}
          PAY_PROVIDER: ${{ secrets.PAY_PROVIDER }}
        run: |
          for name in LIQPAY_PUBLIC_KEY LIQPAY_PRIVATE_KEY PAY_PROVIDER; do
            value="${!name}"
            if [ -z "$value" ]; then echo "$name not set — skipping"; continue; fi
            printf '%s' "$value" | npx --yes wrangler@3 secret put "$name"
          done
      # Field-scout deep link (?agent_mode=true → Telegram). MUST be the same
      # value as the bot Worker's BOUNTY_SECRET — see telegram-bot/wrangler.toml.
      - name: Set bounty token secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOUNTY_SECRET: ${{ secrets.BOUNTY_SECRET }}
        run: |
          if [ -z "$BOUNTY_SECRET" ]; then echo "BOUNTY_SECRET not set — skipping (field-scout deep link stays off until you add it)"; exit 0; fi
          printf '%s' "$BOUNTY_SECRET" | npx --yes wrangler@3 secret put BOUNTY_SECRET
      # Flash deals dispatch their patch through the same pipeline the
      # field-scout flow uses — needs its own copy of the PAT on this Worker.
      - name: Set GitHub PAT secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then echo "GH_PAT not set — skipping (flash deals can't auto-publish/approve until you add it)"; exit 0; fi
          printf '%s' "$GH_PAT" | npx --yes wrangler@3 secret put GH_PAT
