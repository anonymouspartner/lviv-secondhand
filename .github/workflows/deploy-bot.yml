name: Deploy Telegram bot

# Deploys the Cloudflare Worker in telegram-bot/ (the @Secondhandlvivbot bot,
# including the /visit field-agent subsystem). Runs automatically whenever
# telegram-bot/** changes on main — mirrors deploy-worker.yml. Can also be
# run by hand from the Actions tab (no terminal needed).
#
# ── One-time setup: three repo secrets ──
# GitHub → repo Settings → Secrets and variables → Actions → New repository secret:
#
#   CLOUDFLARE_API_TOKEN   — a Cloudflare API token. Create it at
#     dash.cloudflare.com → (top-right profile) → My Profile → API Tokens →
#     Create Token → use the "Edit Cloudflare Workers" template (it grants
#     Workers Scripts:Edit + Workers KV Storage:Edit). Create → copy the token.
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare dashboard → Workers & Pages → the
#     "Account ID" shown in the right sidebar (also in the dashboard URL).
#   BOT_TOKEN              — the @Secondhandlvivbot API token from BotFather
#     (/mybots → the bot → API Token). A secret named TELEGRAM_BOT_TOKEN is
#     also accepted (BOT_TOKEN wins if both are set).
#
# The KV binding, OWNER_ID/AGENT_IDS and pay rates already live in wrangler.toml.
# This workflow regenerates stores.gen.js from index.html, deploys the worker, and
# sets the BOT_TOKEN secret on it. WEBHOOK_SECRET (already set on the worker) and
# any other existing secrets are preserved — `wrangler deploy` never deletes them.
on:
  push:
    branches: [main]
    paths:
      - 'telegram-bot/**'
      - '.github/workflows/deploy-bot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fail early if secrets are missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ]  && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$BOT_TOKEN" ]             && missing="$missing BOT_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing — add them (see this workflow's header) and re-run."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Generate bot dataset from stores.json
        run: node build-data.mjs

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set BOT_TOKEN secret on the worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
        run: printf '%s' "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN

      # Field-scout "bounty" flow (see telegram-agent-keyboards.js) — both
      # optional, skip cleanly if unset. BOUNTY_SECRET must match the metrics
      # Worker's (worker/wrangler.toml) exactly.
      - name: Set BOUNTY_SECRET on the worker
        working-directory: telegram-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOUNTY_SECRET: ${{ secrets.BOUNTY_SECRET }}
        run: |
          if [ -z "$BOUNTY_SECRET" ]; then echo "BOUNTY_SECRET not set — skipping (field-scout flow stays off until you add it)"; exit 0; fi
          printf '%s' "$BOUNTY_SECRET" | npx wrangler secret put BOUNTY_SECRET
      - name: Set GH_PAT on the worker
        working-directory: telegram-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then echo "GH_PAT not set — skipping (field-scout flow can't dispatch patches until you add it)"; exit 0; fi
          printf '%s' "$GH_PAT" | npx wrangler secret put GH_PAT

      # Crowdsourced moderation (Feature 6) — MUST match the metrics Worker's
      # ADMIN_KEY exactly (already used there by /admin/test, /flash-deal/approve).
      - name: Set ADMIN_KEY on the worker
        working-directory: telegram-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then echo "ADMIN_KEY not set — skipping (moderator approve/reject buttons stay off until you add it)"; exit 0; fi
          printf '%s' "$ADMIN_KEY" | npx wrangler secret put ADMIN_KEY
