name: Update map data

# Applies a single-store patch to stores.json without a human in the loop.
# Triggered by a `repository_dispatch` event of type `update_map_data`, sent
# by scripts/patch-store.js (or a Worker calling the same GitHub API
# endpoint directly) with a payload shaped:
#   { store_id: "c21", updates: { phone: "...", hours: { mon: "..." } } }
#
# `updates` is a *partial* patch (deep-merged into the matching store, see
# scripts/apply-map-patch.mjs), never the whole file — so two patches for
# different stores arriving close together can't race and clobber each
# other's unrelated fields the way a full-file overwrite could.
#
# The concurrency group still serialises runs (queued, not cancelled) so two
# patches for the *same* store can't interleave their read-modify-write.
on:
  repository_dispatch:
    types: [update_map_data]

concurrency:
  group: map-data-update
  cancel-in-progress: false

permissions:
  contents: write
  # Only used to raise an issue for the fields this run declined to apply.
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Step 1 — apply the patch. Reads store_id/updates from the event
      # payload (GITHUB_EVENT_PATH), not a workflow-expression env var, so
      # nested/quoted JSON survives without shell-escaping surprises.
      - name: Apply patch
        run: node scripts/apply-map-patch.mjs
        env:
          PATCH_REPORT_FILE: ${{ runner.temp }}/patch-report.json

      # Step 2 — schema gate. Aborts the whole run (nothing committed) if the
      # patch produced anything the app can't safely render: broken JSON,
      # a missing required field, an out-of-range coordinate, a duplicate id,
      # or a non-ISO date.
      - name: Validate schema
        run: node scripts/validate-stores.mjs

      # Step 2b — regenerate the static per-store pages and the sitemap from
      # the patched data. These are committed files served straight to search
      # engines, so skipping this would leave a store's public page showing the
      # hours or restock date the patch just corrected.
      - name: Rebuild store pages
        run: node scripts/build-store-pages.mjs

      # Same reason: a renamed or re-addressed store must reach its printable
      # QR poster, otherwise the next print run names the wrong shop.
      - name: Rebuild QR posters
        run: node scripts/build-qr-posters.mjs

      # Step 3 — commit & deploy. GitHub Pages for this repo serves straight
      # from `main` (no separate build/deploy workflow), so pushing here IS
      # the deploy. Skips cleanly if the patch was a no-op (e.g. updates
      # matched the existing values).
      - name: Commit
        env:
          REPORT: ${{ runner.temp }}/patch-report.json
        run: |
          git config user.name "lviv-secondhand-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stores.json store chain sitemap.xml qr
          if git diff --cached --quiet; then
            echo "No changes after patch — nothing to commit."
            exit 0
          fi
          # Names the stores actually touched, taken from the applier's report
          # rather than the payload — a batch has no single store_id, and a
          # fill-gaps run may have applied to fewer stores than were proposed.
          SUBJECT=$(node -e "
            const r = require(process.env.REPORT);
            const hit = (r.stores || []).filter(x => Object.keys(x.applied || {}).length).map(x => x.store_id);
            console.log(hit.length === 1 ? 'store ' + hit[0]
              : hit.length ? hit.length + ' stores (' + hit.join(', ') + ')'
              : 'map data');
          ")
          git commit -m "Auto-update ${SUBJECT} [skip ci]"
          git push

      # Anything the patch declined — a value that disagrees with one already on
      # the map, or a store the map doesn't hold — is raised for a person. This
      # is what keeps unattended application honest: the safe part lands without
      # anyone reading it, and only the genuine judgment calls become an issue.
      # Runs even when the commit step found nothing to commit, since a run can
      # legitimately apply nothing and still have declines worth seeing.
      - name: Raise anything that needs a decision
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_REPORT_FILE: ${{ runner.temp }}/patch-report.json
          ISSUE_BODY_FILE: ${{ runner.temp }}/issue.md
        run: |
          if [ ! -f "$PATCH_REPORT_FILE" ]; then
            echo "No report written — nothing to raise."
            exit 0
          fi
          COUNT=$(node scripts/render-patch-issue.mjs)
          if [ "$COUNT" = "0" ]; then
            echo "Nothing declined — no issue needed."
            exit 0
          fi
          gh issue create \
            --title "Map patch raised $COUNT change(s) for a decision" \
            --body-file "$ISSUE_BODY_FILE" \
            --label map-contribution
