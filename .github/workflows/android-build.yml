name: Build Android (Capacitor)

# Manual only — building an APK on every push would be wasteful. Run it from the
# Actions tab when you want a sideloadable debug build to smoke-test on a phone.
# (Confirms the native shell loads https://www.lvivsecondhand.com and behaves.)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets & config
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lviv-secondhand-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
