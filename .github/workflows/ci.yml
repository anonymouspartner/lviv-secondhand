name: CI

# Runs the checks that used to only happen by hand before a merge: the
# stores.json schema gate, a syntax check on index.html's inline script (it
# has no build step, so nothing else parses it), and a syntax check on both
# Cloudflare Workers. No dependencies to install — every check here is a
# plain Node script.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate stores.json schema
        run: node scripts/validate-stores.mjs

      - name: Syntax-check index.html's inline script
        run: node scripts/check-inline-js.mjs

      - name: Syntax-check the metrics Worker
        run: node --check worker/worker.js

      - name: Syntax-check the Telegram bot Worker
        run: node --check telegram-bot/worker.js

      - name: Generate the bot's dataset (stores.json → stores.gen.js)
        run: node build-data.mjs
        working-directory: telegram-bot

      # Structural invariants that nothing else covers, each one a bug that
      # actually shipped: a D1 table written to but never created, a Telegram
      # menu entry with no handler, and a Worker fetching another Worker by its
      # public URL (which Cloudflare rejects with error 1042). All three failed
      # silently in production before this check existed.
      - name: Check cross-system wiring
        run: node scripts/check-wiring.mjs

      # The automated map-patch path had never run in production, and the first
      # real dispatch would have reformatted all 130 records — the applier wrote
      # stores.json with indent 1 while every other writer uses 2. This drives
      # the applier as a subprocess against a fixture, the same way the workflow
      # invokes it, and asserts both that formatting survives and that fill-gaps
      # mode never overwrites a value already on the map.
      - name: Check the map-patch pipeline
        run: node scripts/check-map-patch.mjs

      # A workflow with a YAML error does not fail loudly: GitHub names the run
      # after the file path instead of the declared name, and the workflow simply
      # never fires on its real trigger. update-map.yml shipped broken exactly
      # that way and nothing said so.
      - name: Check workflow files parse
        run: node scripts/check-workflows.mjs

      # The per-store pages and sitemap are generated from stores.json but
      # committed (GitHub Pages serves the repo root, so the files ARE the
      # deploy). Regenerate and fail if the committed output differs — that
      # means someone edited stores.json without re-running the generator, and
      # the live pages would be advertising stale hours or restock dates.
      # `git status --porcelain`, not `git diff` — a store ADDED to stores.json
      # produces a brand-new untracked directory, which `git diff` reports as
      # clean. That would let a new store ship with no page and no poster while
      # the check passed.
      - name: Check store pages are in sync with stores.json
        run: |
          node scripts/build-store-pages.mjs
          if [ -n "$(git status --porcelain -- store chain sitemap.xml)" ]; then
            echo "::error::store/, chain/ or sitemap.xml is stale. Run: node scripts/build-store-pages.mjs"
            git status --porcelain -- store chain sitemap.xml
            exit 1
          fi
          echo "Store pages are in sync."

      # Same contract for the printable QR posters: a renamed or re-addressed
      # store has to reach the poster, or an agent prints one that names the
      # wrong shop.
      - name: Check QR posters are in sync with stores.json
        run: |
          node scripts/build-qr-posters.mjs
          if [ -n "$(git status --porcelain -- qr)" ]; then
            echo "::error::qr/ is stale. Run: node scripts/build-qr-posters.mjs"
            git status --porcelain -- qr
            exit 1
          fi
          echo "QR posters are in sync."
