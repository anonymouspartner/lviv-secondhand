name: Queue an Instagram ad for approval

# Renders a paid store advertisement, commits it, and sends it to the owner on
# Telegram with approve / reject links. IT PUBLISHES NOTHING.
#
# That separation is the whole design. A store pays, this workflow prepares the
# post, and it sits in the queue until a human taps approve. The only route from
# here to the public feed is the Worker's /ad/approve endpoint, which then fires
# instagram-ad-publish.yml. Nothing about a completed payment publishes anything.
#
# Triggered by repository_dispatch from worker/worker.js's queueInstagramAd().
# client_payload: { ad_id, store_id, text, tier, image_path, caption_path }
#
# SECRETS: BOT_TOKEN / OWNER_ID (same pair the token watchdog uses),
#          ADMIN_KEY (the same repo secret deploy-worker.yml installs on the
#          Worker, so the two match by construction — it is what lets this
#          workflow register a queue row, and what stops anyone else's)

on:
  repository_dispatch:
    types: [instagram_ad]
  # Hand-run for testing the render without a real payment. It still only
  # queues — there is no input here that can make it post.
  workflow_dispatch:
    inputs:
      store_id: { description: "Store id, e.g. c8", required: true, type: string }
      text:     { description: "Offer line (max 120 chars)", required: true, type: string }
      tier:     { description: "flash | featured | spotlight | verified", required: false, type: string, default: "flash" }

permissions:
  contents: write

env:
  SITE: https://www.lvivsecondhand.com
  WORKER: https://lviv-metrics.lshanalytic.workers.dev

jobs:
  queue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/social
    steps:
      - uses: actions/checkout@v7

      - name: Resolve inputs from either trigger
        id: cfg
        working-directory: .
        env:
          # Via env, never interpolated into the shell: the offer text is
          # buyer-supplied through a Stripe custom field.
          D_ID:    ${{ github.event.client_payload.ad_id }}
          D_STORE: ${{ github.event.client_payload.store_id }}
          D_TEXT:  ${{ github.event.client_payload.text }}
          D_TIER:  ${{ github.event.client_payload.tier }}
          D_TOKEN: ${{ github.event.client_payload.token }}
          # ADMIN_KEY first, and it is the authoritative name: deploy-worker.yml
          # pipes secrets.ADMIN_KEY into the Worker with `wrangler secret put
          # ADMIN_KEY`, so that secret IS the value the Worker compares against.
          # WORKER_ADMIN_KEY was a second name for the same thing, asked for after
          # the repo already had one — the same duplicate-secret mistake as
          # BOT_TOKEN vs TELEGRAM_BOT_TOKEN below. Kept as a fallback so an
          # existing WORKER_ADMIN_KEY still works, but it can never be the one
          # that is right when the two disagree.
          ADMIN_KEY: ${{ secrets.ADMIN_KEY || secrets.WORKER_ADMIN_KEY }}
          W_STORE: ${{ inputs.store_id }}
          W_TEXT:  ${{ inputs.text }}
          W_TIER:  ${{ inputs.tier }}
        run: |
          if [ -n "$D_ID" ]; then
            AD_ID="$D_ID"; STORE="$D_STORE"; TEXT="$D_TEXT"; TIER="$D_TIER"; TOKEN="$D_TOKEN"
            IMG="marketing/instagram/ads/$AD_ID.jpg"; CAP="marketing/instagram/ads/$AD_ID.txt"
          else
            STORE="$W_STORE"; TEXT="$W_TEXT"; TIER="$W_TIER"
            if [ -z "$STORE" ] || [ -z "$TEXT" ]; then
              echo "::error::store id and offer text are both required."
              exit 1
            fi
            # Register with the Worker so a hand-run produces a REAL queue row.
            # Previously it invented an id locally, so its approve link hit a
            # row that did not exist and 404'd — meaning the approve→publish
            # half could not be tested without taking an actual payment.
            # -w writes the status onto its own trailing line. The first
            # version reported only `.reason`, so when the route was missing
            # entirely the error read "Worker refused to register the ad:" with
            # nothing after the colon — the one failure it needed to explain.
            # A secret pasted through a web form very often carries a trailing
            # newline, and the Worker compares the header byte-for-byte, so the
            # key would be "right" everywhere a human looked and still 401.
            CLEAN_KEY=$(printf '%s' "$ADMIN_KEY" | tr -d '\r\n')
            if [ -z "$CLEAN_KEY" ]; then
              echo "::error::No admin key. Set the repo secret ADMIN_KEY — deploy-worker.yml installs that same value on the Worker."
              exit 1
            fi
            if [ "${#CLEAN_KEY}" -ne "${#ADMIN_KEY}" ]; then
              echo "::warning::The admin key contained a line break; it was stripped before sending."
            fi
            R=$(curl -s -w '\n%{http_code}' -X POST "$WORKER/api/ad/register" \
              -H "X-Admin-Key: $CLEAN_KEY" -H 'Content-Type: application/json' \
              -d "$(jq -nc --arg s "$STORE" --arg t "$TEXT" --arg r "$TIER" \
                    '{storeId:$s, text:$t, tier:$r}')" || printf '\n000')
            CODE=$(printf '%s' "$R" | tail -n1)
            R=$(printf '%s' "$R" | sed '$d')
            if [ "$(printf '%s' "$R" | jq -r '.ok // false' 2>/dev/null)" != "true" ]; then
              echo "::error::Worker refused to register the ad (HTTP $CODE): ${R:-<empty body>}"
              # The hint has to match the status, or it sends you after the
              # wrong bug: the first version printed the 204 explanation on a
              # 401, which reads as "the route is missing" when the route in
              # fact answered correctly and only rejected the credential.
              case "$CODE" in
                401) echo "401 means the route matched and the Worker rejected the key. The repo secret ADMIN_KEY is the one the Worker holds - deploy-worker.yml installs it there. If only a stale WORKER_ADMIN_KEY is set, that is the wrong value; set ADMIN_KEY instead." ;;
                204|000) echo "An empty body means the route did not match, or the Worker was unreachable - check /api/ad/register sits in the POST section of worker.js and that the Worker has deployed." ;;
                400) echo "400 means the store id or offer text failed validation - the id must exist in stores.json and the text must be non-empty." ;;
              esac
              exit 1
            fi
            AD_ID=$(echo "$R" | jq -r '.id')
            TOKEN=$(echo "$R" | jq -r '.token')
            IMG=$(echo "$R" | jq -r '.imagePath')
            CAP=$(echo "$R" | jq -r '.captionPath')
          fi
          if [ -z "$AD_ID" ] || [ -z "$TOKEN" ]; then
            echo "::error::no ad id or approval token — cannot build an approvable link."
            exit 1
          fi
          {
            echo "ad_id=$AD_ID"
            echo "store=$STORE"
            echo "tier=$TIER"
            echo "img=$IMG"
            echo "cap=$CAP"
            echo "::add-mask::$TOKEN"
            echo "token=$TOKEN"
          } >> "$GITHUB_OUTPUT"
          # Multi-line safe, and keeps the buyer's text out of the log line.
          {
            echo 'text<<AD_TEXT_EOF'
            printf '%s\n' "$TEXT"
            echo 'AD_TEXT_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install deps + Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Render the ad
        env:
          AD_STORE_ID: ${{ steps.cfg.outputs.store }}
          AD_TEXT: ${{ steps.cfg.outputs.text }}
          AD_TIER: ${{ steps.cfg.outputs.tier }}
          AD_OUT: ${{ steps.cfg.outputs.img }}
        run: node ad-image.mjs

      # The caption is written here, not on the Worker, because stores.json is
      # here — the Worker knows only store ids and would caption an ad "c8".
      - name: Write the caption
        working-directory: .
        env:
          STORE: ${{ steps.cfg.outputs.store }}
          TEXT: ${{ steps.cfg.outputs.text }}
          CAP: ${{ steps.cfg.outputs.cap }}
        run: |
          NAME=$(node -e '
            const s=JSON.parse(require("fs").readFileSync("stores.json","utf8"));
            const f=s.find(x=>x.id===process.env.STORE);
            process.stdout.write(f ? f.name : process.env.STORE);
          ')
          {
            printf '%s\n\n' "$TEXT"
            printf '📍 %s\n' "$NAME"
            printf '%s/?store=%s\n\n' "$SITE" "$STORE"
            printf 'Реклама. Розміщення оплачене магазином.\n\n'
            printf '#секондхендльвів #львів #секондхенд #знижки #lviv\n'
          } > "$CAP"
          echo "Caption written to $CAP"

      - name: Commit the ad
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.cfg.outputs.img }}" "${{ steps.cfg.outputs.cap }}"
          git commit -m "Queue Instagram ad ${{ steps.cfg.outputs.ad_id }} for approval [skip ci]"
          git push

      # Meta fetches image_url over HTTP at publish time, so the image has to be
      # served before anyone can approve it — otherwise the approve tap fails on
      # a 404 the owner cannot diagnose.
      - name: Wait for Pages to serve it
        working-directory: .
        run: |
          URL="$SITE/${{ steps.cfg.outputs.img }}"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L "$URL" || true)
            [ "$CODE" = "200" ] && { echo "Live: $URL"; exit 0; }
            sleep 10
          done
          echo "::error::$URL did not become reachable within 5 minutes."
          exit 1

      - name: Send it to the owner for approval
        working-directory: .
        env:
          # Same fallback chain deploy-bot.yml and deploy-worker.yml use — this
          # repo's token has lived under TELEGRAM_BOT_TOKEN since before
          # BOT_TOKEN existed, and looking only for the latter silently found
          # nothing.
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          TOKEN: ${{ steps.cfg.outputs.token }}
          AD_ID: ${{ steps.cfg.outputs.ad_id }}
          IMG: ${{ steps.cfg.outputs.img }}
          CAP: ${{ steps.cfg.outputs.cap }}
          STORE: ${{ steps.cfg.outputs.store }}
        run: |
          # An error, not a warning. This workflow's job is "queue AND ask" —
          # an ad nobody can be asked about sits in the queue forever, and the
          # run going green would say the opposite. The image and caption are
          # already committed at this point, so nothing is lost by failing here.
          # OWNER_ID is a chat id, not a credential — it is already committed as
          # a plain var in worker/wrangler.toml. Read it from there rather than
          # asking for a secret that duplicates a value the repo already holds.
          if [ -z "$OWNER_ID" ]; then
            OWNER_ID=$(sed -n 's/^OWNER_ID *= *"\([0-9-]*\)".*/\1/p' worker/wrangler.toml | head -1)
            [ -n "$OWNER_ID" ] && echo "OWNER_ID taken from worker/wrangler.toml"
          fi
          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "::error::No Telegram bot token (BOT_TOKEN or TELEGRAM_BOT_TOKEN) or no OWNER_ID, so the approval request cannot be sent and this ad can never be approved."
            exit 1
          fi
          # Per-ad token, not ADMIN_KEY. This link goes through Telegram, where
          # it is screenshot, forwarded and stored on someone else's servers —
          # so it must not carry the credential that also opens /orders.
          APPROVE="$WORKER/ad/approve?id=$AD_ID&t=$TOKEN"
          REJECT="$WORKER/ad/reject?id=$AD_ID&t=$TOKEN"
          # The caption is quoted in full, because this message IS the approval:
          # the publish step reads back this same committed file.
          CAPTION_BODY=$(cat "$CAP")
          MSG=$(printf '%s\n\n%s\n\n%s\n%s\n\n%s\n%s\n\n%s\n%s' \
            "📣 Реклама чекає на підтвердження · Ad awaiting approval" \
            "Магазин · Store: $STORE" \
            "Підпис · Caption:" \
            "$CAPTION_BODY" \
            "✅ Опублікувати · Publish:" "$APPROVE" \
            "❌ Відхилити · Reject:" "$REJECT")
          # sendPhoto so the owner decides on the actual image, not a filename.
          #
          # The response is checked. The first version discarded it with
          # `-o /dev/null || true`, so the step went green whether Telegram
          # accepted the message or not — and when BOT_TOKEN was missing it
          # reported success for an ad nobody was ever told about. A send that
          # does not arrive is a failed run, because approval is the feature.
          RESP=$(curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendPhoto" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg c "$OWNER_ID" --arg p "$SITE/$IMG" --arg cap "$MSG" \
                  '{chat_id:$c, photo:$p, caption:$cap}')" || echo '{}')
          if [ "$(echo "$RESP" | jq -r '.ok // false')" != "true" ]; then
            echo "::error::Telegram rejected the approval request: $(echo "$RESP" | jq -c '{error_code, description}' 2>/dev/null || echo "$RESP")"
            echo "The ad is committed at $IMG but nobody was asked about it."
            exit 1
          fi
          echo "::notice::Ad $AD_ID queued and sent for approval. Nothing has been posted."
